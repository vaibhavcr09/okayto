<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet — Okayto</title>
<link rel="stylesheet" href="css/base.css">
<style>
body{background:var(--bg);color:var(--ink2);--navbg:var(--bg)}
.dhero{position:relative;min-height:100vh;padding:120px var(--g) 8vh;overflow:hidden;display:grid;grid-template-columns:1fr;align-content:end}
.blob{position:absolute;border-radius:50%;background:rgba(0,0,0,.07);pointer-events:none}
.dhero .word{font-size:clamp(90px,var(--fit,21vw),400px);position:relative;z-index:1;margin-top:auto}
.dhero .word span{display:inline-block}
.dhero .pl{position:absolute;right:max(var(--g),5vw);top:12vh;width:min(36vw,54vh);z-index:2}
.dhero .pl .plate{animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dhero .low{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-top:4vh}
.dhero .line{max-width:460px;font-size:clamp(18px,1.5vw,22px);line-height:1.35}
.counter{display:flex;align-items:flex-end;gap:14px}
.counter .n{font-family:var(--display);font-size:clamp(90px,10vw,170px);line-height:.78}
.counter .l{font:600 15px var(--body);max-width:170px;line-height:1.25;padding-bottom:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.sw button{font:600 15px var(--body);padding:12px 18px;border-radius:40px;border:none;cursor:pointer;background:var(--c);color:var(--ci);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink2) 40%,transparent),0 10px 18px -10px rgba(0,0,0,.6);transition:transform .45s var(--spring)}
.sw button:hover{transform:translateY(-3px) rotate(-2deg)}
.checks{background:var(--paper2);color:var(--ink);padding:14vh var(--g);border-radius:44px 44px 0 0;position:relative}
.checks h2,.pass h2{font-size:clamp(60px,8.4vw,150px)}
.crow{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,48px);align-items:baseline;padding:28px 0;border-top:2px solid rgba(28,18,6,.12)}
.crow .ix{font-family:var(--display);font-size:clamp(70px,8vw,140px);line-height:.8;color:var(--tag);text-shadow:0 .014em 0 rgba(0,0,0,.25),0 .05em .1em rgba(0,0,0,.15)}
.crow .tx{font-family:var(--display);font-size:clamp(30px,3.4vw,58px);line-height:.95;text-transform:uppercase}
.list{margin-top:7vh}
.pass{background:var(--paper2);color:var(--ink);padding:0 var(--g) 14vh}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(16px,3vw,40px);align-items:center;padding:24px 0;border-top:2px solid rgba(28,18,6,.12);text-decoration:none;color:var(--ink);position:relative}
.prow .plate{width:clamp(76px,8vw,120px);transition:transform .8s var(--out)}
.prow:hover .plate{transform:rotate(40deg) scale(1.08)}
.prow .nm{font-family:var(--display);font-size:clamp(40px,5.4vw,96px);line-height:.85;text-transform:uppercase;transition:transform .5s var(--spring)}
.prow:hover .nm{transform:translateX(14px)}
.prow .mt{font-size:15px;margin-top:8px;opacity:.8}
.prow .go{font-family:var(--display);font-size:clamp(40px,4vw,70px);line-height:.8;text-align:right}
.prow .go small{display:block;font:600 13px var(--body);margin-top:6px}
.wipe{position:fixed;inset:0;z-index:85;pointer-events:none;clip-path:circle(0% at 50% 50%)}
@media (max-width:820px){
  .dhero{align-content:start;padding-top:96px}
  .dhero .pl{position:relative;right:auto;top:auto;width:80vw;margin:2vh auto 5vh}
  .dhero .word{font-size:clamp(70px,calc(var(--fit) * 1.6),140px);margin-top:4vh}
  .prow{grid-template-columns:auto 1fr}.prow .go{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<main id="app"></main>
<div class="wipe" id="wipe"></div>
<script src="js/data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/page.js"></script>
<script src="lib/gsap.min.js"></script>
<script>
const d=OK.diet(OK.q('d'))||OK.DIETS[0];
document.title=d.name+' in Bengaluru — Okayto';
const dark=d.ink.toLowerCase()!=='#1c1206';
document.body.style.setProperty('--bg',d.bg);document.body.style.setProperty('--ink2',d.ink);document.body.style.setProperty('--tag',d.tag);
document.body.style.setProperty('--paper2',d.k==='gf'?'#FBF5EA':'#FBF5EA');
const pass=OK.R.filter(r=>OK.fitsDiet(r,d.k));
const app=document.getElementById('app');
app.innerHTML=`
<section class="dhero" ${dark?'data-dark':''}>
  <div class="blob" style="width:60vw;height:60vw;left:-20vw;top:-24vw"></div><div class="blob" style="width:36vw;height:36vw;right:-10vw;bottom:-14vw"></div>
  <div class="pl">${plate(d.fill)}</div>
  <div style="position:relative;z-index:3"><span class="eyebrow">Eating ${d.name.toLowerCase()} in Bengaluru</span>
    <div class="sw" id="sw"></div></div>
  <h1 class="word display depth" id="word" style="--fit:${Math.min(21,56/(Math.max(...d.name.split(' ').map(w=>w.length))*.56)).toFixed(2)}vw">${d.name.split(' ').map(w=>`<span>${w}</span>`).join('<br>')}</h1>
  <div class="low">
    <p class="line">${d.line}</p>
    <div class="counter"><span class="n" id="cn">${d.nfrom||0}</span><span class="l">${d.nl}</span></div>
  </div>
</section>
<section class="checks">
  <span class="eyebrow reveal">What we check</span>
  <h2 class="display depth reveal" style="margin-top:14px">Every plate,<br>every time.</h2>
  <div class="list">${d.checks.map((c,i)=>`<div class="crow reveal"><span class="ix">0${i+1}</span><span class="tx">${c}</span></div>`).join('')}</div>
</section>
<section class="pass">
  <span class="eyebrow reveal">Kitchens that pass</span>
  <h2 class="display depth reveal" style="margin:14px 0 6vh">${pass.length} near you.</h2>
  ${pass.map(r=>`<a class="prow reveal" href="restaurant.html?id=${r.id}&d=${d.k}">${plate(r.img)}<div><div class="nm">${r.n}</div><div class="mt">${r.area} · ${r.note}${r.warn?` · ${r.warn}`:''}</div></div><div class="go">${r.km.toFixed(1)}<small>km · ${r.open.toLowerCase()}</small></div></a>`).join('')}
  <div style="margin-top:6vh;display:flex;gap:10px;flex-wrap:wrap" class="reveal"><a class="btn" href="map.html?d=${d.k}">See them on the map</a><a class="btn ghost" href="index.html#finder">Combine diets in your dabba</a></div>
</section>`;
// switcher with circular wipe
const sw=document.getElementById('sw'),wipe=document.getElementById('wipe');
OK.DIETS.filter(o=>o.k!==d.k).forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=o.name;b.style.setProperty('--c',o.bg);b.style.setProperty('--ci',o.ink);
  b.onclick=e=>{const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;wipe.style.background=o.bg;
    if(!window.gsap){location.href='diet.html?d='+o.k;return}
    gsap.fromTo(wipe,{clipPath:`circle(0% at ${x}px ${y}px)`},{clipPath:`circle(150% at ${x}px ${y}px)`,duration:.75,ease:'power3.inOut',onComplete:()=>location.href='diet.html?d='+o.k})};
  sw.append(b)});
// intro motion
if(window.gsap){
  gsap.from('#word span',{yPercent:110,duration:1.1,stagger:.08,ease:'power4.out'});
  gsap.from('.dhero .pl',{scale:.5,rotation:-90,opacity:0,duration:1.4,ease:'power3.out'});
  gsap.to('#cn',{innerText:d.n,duration:1.6,delay:.4,snap:{innerText:1},ease:'power2.out'});
  addEventListener('scroll',()=>{gsap.to('.dhero .pl',{y:scrollY*.25,rotation:scrollY*.05,duration:.6,overwrite:'auto'})},{passive:true});
}else document.getElementById('cn').textContent=d.n;
revealCheck();navTone();
// reset wipe when returning via back/forward cache
addEventListener('pageshow',()=>{wipe.style.clipPath='circle(0% at 50% 50%)'});
</script>
</body>
</html>
